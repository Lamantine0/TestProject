<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create TODO</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            resize: none
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #000000;
            border-radius: 10px;
            background-color: #f9f9f9;
            resize: none;
        }
        .form-container h1 {
            text-align: center;
            margin-bottom: 20px;
            resize: none;
        }
        .form-container .btn {
            width: 100%;
            resize: none;
        }
        .form-container input[type="text"],
        .form-container textarea {
            width: 94%; /* Ширина на всю доступную область */
            padding: 15px; /* Внутренние отступы */
            font-size: 16px; /* Размер шрифта */
            border: 0.5px solid #000000; /* Граница */
            border-radius: 5px; /* Скругление углов */
            margin-bottom: 15px; /* Отступ снизу */
            transition: border-color 0.3s ease; /* Плавное изменение цвета границы */
            resize: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Create TODO</h1>
        <form action="/create_todo" method="post">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <!-- Подключение Bootstrap JS (необязательно, но полезно для некоторых компонентов) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
